<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waldlichtung – WebGPU / WebXR Demo</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
	canvas { display: block; }
	#info {
		position: fixed; left: 12px; top: 12px; z-index: 10;
		color: #fff; background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 8px;
		font-size: 13px; line-height: 1.45; pointer-events: none; white-space: pre;
	}
	#info b { color: #ffd479; }
	#hint {
		position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9;
		color: #fff; background: rgba(0,0,0,.5); padding: 14px 22px; border-radius: 10px;
		font-size: 18px; text-align: center; pointer-events: none; line-height: 1.6;
	}
	#hint small { font-size: 13px; opacity: .85; }
	#errlog {
		position: fixed; left: 12px; bottom: 70px; right: 12px; z-index: 11; display: none;
		color: #fff; background: rgba(160,20,20,.85); padding: 8px 12px; border-radius: 8px;
		font: 12px/1.4 monospace; white-space: pre-wrap;
	}
	#error {
		position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
		color: #fff; background: #222; padding: 2em; text-align: center; font-size: 18px;
	}
</style>
<script type="importmap">
{
	"imports": {
		"three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
		"three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
		"three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
		"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
	}
}
</script>
</head>
<body>
<div id="info">Lade …</div>
<div id="error"></div>
<div id="errlog"></div>
<div id="hint">Ins Bild klicken, um loszulaufen<br><small>W A S D laufen · Maus umsehen · Shift rennen · Leertaste springen · Esc Menü</small></div>
<script>
	// Fehler sichtbar auf der Seite anzeigen (hilfreich auf der VR-Brille, dort gibt es keine Konsole)
	( function () {
		const seen = new Set();
		function show( msg ) {
			msg = String( msg ).slice( 0, 300 );
			if ( seen.has( msg ) || seen.size > 5 ) return;
			seen.add( msg );
			const box = document.getElementById( 'errlog' );
			box.style.display = 'block';
			box.textContent += ( box.textContent ? '\n' : '' ) + '⚠ ' + msg;
		}
		window.addEventListener( 'error', e => show( e.message || e.error ) );
		window.addEventListener( 'unhandledrejection', e => show( e.reason && ( e.reason.message || e.reason ) ) );
		window.__showError = show;
	} )();
</script>

<script type="module">
import * as THREE from 'three/webgpu';
import {
	Fn, uniform, attribute, uv, time, vec2, vec3, vec4, float, sin, cos, mix, smoothstep, pow, max, dot, normalize,
	positionLocal, positionWorld, normalWorld, cameraPosition, mx_noise_float, mx_fractal_noise_float, mx_cell_noise_float,
	pass, mrt, output, velocity, renderOutput, texture, screenUV
} from 'three/tsl';
import { SkyMesh } from 'three/addons/objects/SkyMesh.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { fxaa } from 'three/addons/tsl/display/FXAANode.js';
import { smaa } from 'three/addons/tsl/display/SMAANode.js';
import { traa } from 'three/addons/tsl/display/TRAANode.js';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';
import { HTMLMesh } from 'three/addons/interactive/HTMLMesh.js';
import { InteractiveGroup } from 'three/addons/interactive/InteractiveGroup.js';

// ---------------------------------------------------------------------------
// Hilfsfunktionen
// ---------------------------------------------------------------------------

// Reproduzierbarer Zufall, damit der Wald bei jedem Laden gleich aussieht
function mulberry32( a ) {
	return function () {
		a |= 0; a = a + 0x6D2B79F5 | 0;
		let t = Math.imul( a ^ a >>> 15, 1 | a );
		t = t + Math.imul( t ^ t >>> 7, 61 | t ) ^ t;
		return ( ( t ^ t >>> 14 ) >>> 0 ) / 4294967296;
	};
}
const rand = mulberry32( 1234 );
const rr = ( a, b ) => a + ( b - a ) * rand();

const CLEARING = 14; // Radius der Lichtung in Metern

// Geländehöhe: flache Lichtung, sanfte Hügel im Wald
function terrainHeight( x, z ) {
	const r = Math.hypot( x, z );
	const hills = Math.sin( x * 0.045 ) * Math.cos( z * 0.038 ) * 2.4
		+ Math.sin( x * 0.13 + 1.3 ) * Math.sin( z * 0.11 + 0.4 ) * 0.7
		+ Math.sin( x * 0.31 + z * 0.27 ) * 0.15;
	const t = THREE.MathUtils.smoothstep( r, CLEARING * 0.8, CLEARING * 2.2 );
	return hills * t + Math.sin( x * 0.4 ) * Math.cos( z * 0.35 ) * 0.06;
}

// ---------------------------------------------------------------------------
// Renderer, Szene, Kamera
// ---------------------------------------------------------------------------

// ?emu = Quest-3-Emulator (IWER) zum Testen ohne Brille
if ( new URLSearchParams( location.search ).has( 'emu' ) ) {
	const { XRDevice, metaQuest3 } = await import( 'https://esm.sh/iwer@2.8.0' );
	window.__xrDevice = new XRDevice( metaQuest3 );
	window.__xrDevice.installRuntime( { forceInstall: true, polyfillLayers: true } );
}

if ( ! navigator.gpu ) {
	console.warn( 'WebGPU nicht verfügbar – three.js nutzt automatisch WebGL 2.' );
}

// Technik beim Laden festlegen (ein Wechsel mitten im VR-Start führte zu schwarzem Bild):
// - Gerät kann VR, aber kein WebGPU-XR (z. B. Quest-Browser) -> gleich WebGL 2
// - sonst WebGPU. Erzwingen per ?webgl oder ?webgpu
const query = new URLSearchParams( location.search );
const hasXRGPU = typeof globalThis.XRGPUBinding !== 'undefined';
const vrCapable = navigator.xr ? await navigator.xr.isSessionSupported( 'immersive-vr' ).catch( () => false ) : false;
const forceWebGL = query.has( 'webgl' ) || ( ! query.has( 'webgpu' ) && vrCapable && ! hasXRGPU );

// Auf VR-Geräten (oder mit ?low) weniger Details, damit es flüssig läuft; ?hoch erzwingt volle Details
const LOW = ( vrCapable || query.has( 'low' ) ) && ! query.has( 'hoch' );

let renderer = new THREE.WebGPURenderer( { antialias: true, forceWebGL, multiview: forceWebGL && query.has( 'mv' ) } );
configureRenderer( renderer );
document.body.appendChild( renderer.domElement );
await renderer.init();
// Nur Emulator: IWER liefert framebuffer = null, three erwartet ein Objekt als WeakMap-Schlüssel
if ( query.has( 'emu' ) && renderer.backend.state ) renderer.backend.state.currentDrawbuffers = new Map();

function configureRenderer( r ) {
	r.setPixelRatio( Math.min( window.devicePixelRatio, 2 ) );
	r.setSize( window.innerWidth, window.innerHeight );
	r.toneMapping = THREE.AgXToneMapping;
	r.toneMappingExposure = 1.0;
	r.shadowMap.enabled = true;
	r.shadowMap.type = THREE.PCFShadowMap;
	r.xr.enabled = true;
}

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2( 0xa9c4d6, 0.005 );

const rig = new THREE.Group(); // in VR: Position des Spielers
scene.add( rig );
const camera = new THREE.PerspectiveCamera( 65, window.innerWidth / window.innerHeight, 0.1, 600 );
camera.position.set( 0, 1.7, 11 );
rig.add( camera );

camera.rotation.order = 'YXZ'; // erst Blick links/rechts (Yaw), dann hoch/runter (Pitch)

// Hindernisse für die Kollision: Kreise (Felsen) und Kapseln (Baumstamm am Boden)
const obstacles = [];

// ---------------------------------------------------------------------------
// Uniforms, die mehrere Shader teilen
// ---------------------------------------------------------------------------

const U = {
	windStrength: uniform( 1.0 ),
	windSpeed: uniform( 1.0 ),
	windDir: uniform( new THREE.Vector2( 1, 0.35 ).normalize() ),
	sunDir: uniform( new THREE.Vector3( 0, 1, 0 ) ),
	sunColor: uniform( new THREE.Color( 1, 1, 1 ) ),
	translucency: uniform( 0.35 ),
	fireflyGlow: uniform( 6.0 )
};

// Wind als TSL-Funktion: großräumige Böen (Noise) + schnelles Flattern (Sinus)
const windAt = Fn( ( [ p, freq ] ) => {
	const t = time.mul( U.windSpeed );
	const gust = mx_noise_float( vec2( p.x.mul( 0.04 ).sub( t.mul( 0.25 ) ), p.y.mul( 0.04 ) ) ).mul( 0.5 ).add( 0.5 );
	const flutter = sin( t.mul( freq ).add( p.x.mul( 0.7 ) ).add( p.y.mul( 0.5 ) ) ).mul( 0.35 );
	return gust.add( flutter.mul( gust.add( 0.3 ) ) ).mul( U.windStrength );
} );

// ---------------------------------------------------------------------------
// Himmel & Licht
// ---------------------------------------------------------------------------

const sky = new SkyMesh();
sky.scale.setScalar( 4000 );
sky.turbidity.value = 4;
sky.rayleigh.value = 1.2;
sky.mieCoefficient.value = 0.004;
sky.mieDirectionalG.value = 0.85;
scene.add( sky );

const hemi = new THREE.HemisphereLight( 0xbfd8ff, 0x3a4a22, 0.9 );
scene.add( hemi );

const sun = new THREE.DirectionalLight( 0xffffff, 3.2 );
sun.castShadow = true;
sun.shadow.mapSize.set( LOW ? 1024 : 2048, LOW ? 1024 : 2048 );
sun.shadow.camera.left = - 45;
sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45;
sun.shadow.camera.bottom = - 45;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 260;
sun.shadow.bias = - 0.0004;
sun.shadow.normalBias = 0.03;
sun.shadow.radius = 3;
scene.add( sun, sun.target );

const shadowHelper = new THREE.CameraHelper( sun.shadow.camera );
shadowHelper.visible = false;
scene.add( shadowHelper );

const params = {
	time: query.has( 'zeit' ) ? Number( query.get( 'zeit' ) ) : 16.5, // Uhrzeit 0–24 (?zeit=22)
	cycle: query.get( 'zyklus' ) !== '0',                            // Tag/Nacht läuft (?zyklus=0 hält an)
	dayMinutes: 10,                                                   // echte Minuten pro 24-h-Tag
	sunAzimuth: 75,                                                   // dreht die Sonnenbahn
	fogDensity: 0.005,
	clouds: 0.35,
	fireflies: 6,
	lanterns: 'Automatisch',
	lanternPower: 1,
	sunElevation: 0                                                   // wird aus der Uhrzeit berechnet
};
let noClouds = false; // in VR auf schwachen Geräten: Wolken-Shader aus

U.night = uniform( 0 );     // 0 = Tag … 1 = tiefe Nacht
U.lanternOn = uniform( 0 ); // 0 = aus … Helligkeit

// Sonnenhöhe aus der Uhrzeit: Höchststand 50° um 13 Uhr, Aufgang ~7:30, Untergang ~18:30
const sunElevationAt = t => 57 * Math.cos( ( t - 13 ) / 24 * Math.PI * 2 ) - 7;
const dirFrom = ( elevDeg, azDeg ) => new THREE.Vector3().setFromSphericalCoords( 1, THREE.MathUtils.degToRad( 90 - elevDeg ), THREE.MathUtils.degToRad( azDeg ) );

// --- Sterne: Kugel um die Szene, Sterne per Zellen-Rauschen im Shader, funkeln leicht
const stars = ( () => {
	const mat = new THREE.MeshBasicNodeMaterial( { side: THREE.BackSide, transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending } );
	const dir = normalize( positionWorld.sub( cameraPosition ) );
	const cell = dir.mul( 650 );
	const h = mx_cell_noise_float( cell );
	const h2 = mx_cell_noise_float( cell.add( 31.7 ) );
	const star = smoothstep( 0.9988, 1.0, h ).mul( h2.mul( 1.6 ).add( 0.4 ) );
	const twinkle = sin( time.mul( h2.mul( 3 ).add( 1 ) ).add( h2.mul( 60 ) ) ).mul( 0.3 ).add( 0.7 );
	const horizon = smoothstep( 0.02, 0.2, dir.y );
	mat.colorNode = vec3( 0.85, 0.9, 1.0 ).mul( star ).mul( twinkle ).mul( horizon ).mul( U.night ).mul( 2.5 );
	const mesh = new THREE.Mesh( new THREE.SphereGeometry( 450, 32, 16 ), mat );
	mesh.frustumCulled = false;
	mesh.renderOrder = - 1;
	scene.add( mesh );
	return mesh;
} )();

// --- Mond: leuchtende Kugel gegenüber der Sonne (Bloom gibt den Hof)
const moon = new THREE.Mesh( new THREE.SphereGeometry( 7, 24, 12 ), new THREE.MeshBasicNodeMaterial( { fog: false } ) );
moon.material.colorNode = vec3( 1.0, 0.96, 0.86 ).mul( U.night.mul( 2.2 ) );
scene.add( moon );

const _c1 = new THREE.Color(), _c2 = new THREE.Color(), _c3 = new THREE.Color();
const _sunDir = new THREE.Vector3(), _moonDir = new THREE.Vector3();
function updateSun() {
	const elev = params.sunElevation = sunElevationAt( params.time );
	const az = params.sunAzimuth + ( params.time - 13 ) * 15;
	_sunDir.copy( dirFrom( elev, az ) );
	const moonElev = THREE.MathUtils.clamp( - elev * 0.8, 12, 55 );
	_moonDir.copy( dirFrom( moonElev, az + 180 ) );

	const S = THREE.MathUtils.smoothstep;
	const nightK = 1 - S( elev, - 9, - 1 );    // 1 = tiefe Nacht
	const dayK = S( elev, - 4, 6 );            // 1 = Tag
	U.night.value = nightK;

	sky.sunPosition.value.copy( _sunDir );
	sky.cloudCoverage.value = noClouds ? 0 : params.clouds;

	// Hauptlicht: tagsüber Sonne, nachts Mond (Wechsel, wenn beide fast dunkel sind)
	const e = THREE.MathUtils.clamp( elev / 45, 0, 1 );
	if ( elev > - 3 ) {
		const lightDir = dirFrom( Math.max( elev, 3 ), az ); // Schatten nicht flacher als 3°
		sun.position.copy( lightDir ).multiplyScalar( 120 );
		_c1.setRGB( 1.0, 0.5, 0.25 ); _c2.setRGB( 1.0, 0.97, 0.9 );
		sun.color.copy( _c1 ).lerp( _c2, Math.sqrt( e ) );
		sun.intensity = ( 0.6 + 2.8 * Math.sqrt( e ) ) * S( elev, - 3, 3 );
		U.sunDir.value.copy( lightDir );
	} else {
		sun.position.copy( _moonDir ).multiplyScalar( 120 );
		sun.color.setRGB( 0.6, 0.72, 1.0 );
		sun.intensity = 0.42 * S( - elev, 3, 7 );
		U.sunDir.value.copy( _moonDir );
	}
	sun.target.position.set( 0, 0, 0 );
	U.sunColor.value.copy( sun.color ).multiplyScalar( Math.min( 1, sun.intensity / 1.5 ) );

	// Himmelslicht: tagsüber hellblau, nachts dunkles Blau
	_c1.setRGB( 0.75, 0.85, 1.0 ); _c2.setRGB( 0.22, 0.29, 0.13 );
	_c3.setRGB( 0.22, 0.3, 0.55 );
	hemi.color.copy( _c3 ).lerp( _c1, dayK );
	hemi.groundColor.setRGB( 0.04, 0.05, 0.04 ).lerp( _c2, dayK );
	hemi.intensity = THREE.MathUtils.lerp( 0.32, 0.25 + 0.75 * e, dayK );

	// Nebel: Tag bläulich, Dämmerung warm, Nacht tiefblau
	_c1.setRGB( 0.85, 0.5, 0.38 ); _c2.setRGB( 0.62, 0.74, 0.84 );
	_c3.copy( _c1 ).lerp( _c2, Math.sqrt( e ) ).multiplyScalar( 0.35 + 0.65 * e );
	scene.fog.color.setRGB( 0.012, 0.018, 0.04 ).lerp( _c3, S( elev, - 10, 4 ) );

	// nachts etwas heller belichten (wie das Auge, das sich anpasst)
	renderer.toneMappingExposure = settings.exposure * ( 1 + 0.9 * nightK );

	moon.position.copy( _moonDir ).multiplyScalar( 420 );
	moon.visible = nightK > 0.01;
	stars.visible = nightK > 0.01;

	U.fireflyGlow.value = params.fireflies * ( 0.25 + 1.1 * nightK );
	const autoOn = 1 - S( elev, - 2, 8 ); // Laternen gehen in der Dämmerung an
	const on = params.lanterns === 'An' ? 1 : params.lanterns === 'Aus' ? 0 : autoOn;
	U.lanternOn.value = on * params.lanternPower;

	if ( shadowHelper.visible ) shadowHelper.update();
}

// ---------------------------------------------------------------------------
// Boden – Farbe komplett prozedural im Shader
// ---------------------------------------------------------------------------

{
	const size = 400, seg = 220;
	const geo = new THREE.PlaneGeometry( size, size, seg, seg );
	geo.rotateX( - Math.PI / 2 );
	const pos = geo.attributes.position;
	for ( let i = 0; i < pos.count; i ++ ) pos.setY( i, terrainHeight( pos.getX( i ), pos.getZ( i ) ) );
	geo.computeVertexNormals();

	const mat = new THREE.MeshStandardNodeMaterial( { roughness: 0.95 } );
	const p = positionWorld.xz;
	const r = p.length();
	const n1 = mx_fractal_noise_float( p.mul( 0.08 ), 4 ).mul( 0.5 ).add( 0.5 );
	const n2 = mx_noise_float( p.mul( 0.9 ) ).mul( 0.5 ).add( 0.5 );
	const grassC = mix( vec3( 0.10, 0.20, 0.035 ), vec3( 0.22, 0.32, 0.06 ), n1 );
	const forestC = mix( vec3( 0.12, 0.085, 0.05 ), vec3( 0.20, 0.17, 0.08 ), n2 ); // Nadelstreu
	const mossC = vec3( 0.09, 0.16, 0.05 );
	const inForest = smoothstep( CLEARING * 0.9, CLEARING * 1.6, r.add( n1.mul( 6 ) ) );
	let col = mix( grassC, mix( forestC, mossC, smoothstep( 0.45, 0.7, n1 ) ), inForest );
	// kleiner Trampelpfad
	const path = float( 1 ).sub( smoothstep( 0.4, 1.4, p.y.sub( sin( p.x.mul( 0.15 ) ).mul( 3 ) ).abs().add( n2.mul( 0.6 ) ) ) );
	col = mix( col, vec3( 0.25, 0.19, 0.12 ), path.mul( 0.8 ) );
	mat.colorNode = col.mul( n2.mul( 0.25 ).add( 0.85 ) );
	mat.roughnessNode = mix( float( 0.95 ), float( 0.8 ), path );

	const ground = new THREE.Mesh( geo, mat );
	ground.receiveShadow = true;
	scene.add( ground );
}

// ---------------------------------------------------------------------------
// Gras – zehntausende Halme, im Vertex-Shader vom Wind gebogen
// ---------------------------------------------------------------------------

const grass = ( () => {
	const COUNT = Number( query.get( 'gras' ) ) || ( LOW ? 30000 : 70000 ); // ?gras=20000 für schwache Geräte
	const SEG = 3; // Segmente pro Halm -> 2*SEG+1 Vertices
	const vpb = SEG * 2 + 1;
	const positions = new Float32Array( COUNT * vpb * 3 );
	const normals = new Float32Array( COUNT * vpb * 3 );
	const uvs = new Float32Array( COUNT * vpb * 2 );
	const winds = new Float32Array( COUNT * vpb * 3 );
	const indices = new Uint32Array( COUNT * ( SEG * 2 - 1 + 1 ) * 3 );

	let vi = 0, ii = 0;
	for ( let b = 0; b < COUNT; b ++ ) {
		// Dichte nimmt zum Waldrand hin ab
		let x, z, r;
		do {
			const a = rand() * Math.PI * 2;
			r = Math.sqrt( rand() ) * CLEARING * 1.75;
			x = Math.cos( a ) * r; z = Math.sin( a ) * r;
		} while ( r > CLEARING && rand() < ( r - CLEARING ) / ( CLEARING * 0.75 ) );

		const y0 = terrainHeight( x, z );
		const h = rr( 0.15, 0.42 ) * ( r > CLEARING ? 0.7 : 1 );
		const w = rr( 0.025, 0.045 );
		const rot = rand() * Math.PI * 2;
		const lean = rr( 0.0, 0.25 );
		const cx = Math.cos( rot ), sz = Math.sin( rot );
		const rnd = rand();
		const base = vi;

		for ( let s = 0; s <= SEG; s ++ ) {
			const t = s / SEG;
			const ww = w * ( 1 - t * 0.85 );
			const off = lean * t * t * h;
			const sides = s === SEG ? [ 0.5 ] : [ 0, 1 ];
			for ( const side of sides ) {
				const lx = ( side - 0.5 ) * 2 * ( s === SEG ? 0 : ww );
				positions[ vi * 3 ] = x + lx * cx + off * - sz;
				positions[ vi * 3 + 1 ] = y0 + t * h;
				positions[ vi * 3 + 2 ] = z + lx * sz + off * cx;
				// Normalen nach oben gekippt -> weicheres, „flauschiges“ Licht
				const nx = - sz * 0.35, nz = cx * 0.35;
				const nl = Math.hypot( nx, 1, nz );
				normals[ vi * 3 ] = nx / nl; normals[ vi * 3 + 1 ] = 1 / nl; normals[ vi * 3 + 2 ] = nz / nl;
				uvs[ vi * 2 ] = side; uvs[ vi * 2 + 1 ] = t;
				winds[ vi * 3 ] = x; winds[ vi * 3 + 1 ] = z; winds[ vi * 3 + 2 ] = rnd;
				vi ++;
			}
		}
		for ( let s = 0; s < SEG - 1; s ++ ) {
			const a = base + s * 2;
			indices[ ii ++ ] = a; indices[ ii ++ ] = a + 1; indices[ ii ++ ] = a + 2;
			indices[ ii ++ ] = a + 1; indices[ ii ++ ] = a + 3; indices[ ii ++ ] = a + 2;
		}
		const a = base + ( SEG - 1 ) * 2;
		indices[ ii ++ ] = a; indices[ ii ++ ] = a + 1; indices[ ii ++ ] = a + 2;
	}

	const geo = new THREE.BufferGeometry();
	geo.setAttribute( 'position', new THREE.BufferAttribute( positions, 3 ) );
	geo.setAttribute( 'normal', new THREE.BufferAttribute( normals, 3 ) );
	geo.setAttribute( 'uv', new THREE.BufferAttribute( uvs, 2 ) );
	geo.setAttribute( 'aWind', new THREE.BufferAttribute( winds, 3 ) );
	geo.setIndex( new THREE.BufferAttribute( indices.subarray( 0, ii ), 1 ) );
	geo.computeBoundingSphere();

	const mat = new THREE.MeshStandardNodeMaterial( { side: THREE.DoubleSide, roughness: 0.75 } );
	const aWind = attribute( 'aWind', 'vec3' );
	const h = uv().y;
	const bend = h.mul( h ).mul( windAt( aWind.xy, 3.1 ) ).mul( 0.35 );
	mat.positionNode = positionLocal.add( vec3( U.windDir.x.mul( bend ), bend.mul( bend ).mul( - 0.5 ), U.windDir.y.mul( bend ) ) );

	const patch = mx_noise_float( aWind.xy.mul( 0.15 ) ).mul( 0.5 ).add( 0.5 );
	const baseC = vec3( 0.03, 0.08, 0.01 );
	const tipC = mix( vec3( 0.25, 0.42, 0.07 ), vec3( 0.48, 0.48, 0.12 ), patch.mul( patch ) );
	mat.colorNode = mix( baseC, tipC, pow( h, 0.8 ) ).mul( aWind.z.mul( 0.4 ).add( 0.8 ) );
	// Durchscheinen: Gegenlicht lässt die Spitzen leuchten
	const viewDir = normalize( positionWorld.sub( cameraPosition ) );
	const back = pow( max( dot( viewDir, U.sunDir ), 0 ), 6 );
	mat.emissiveNode = tipC.mul( U.sunColor ).mul( back.mul( h ).mul( U.translucency ) );

	const mesh = new THREE.Mesh( geo, mat );
	mesh.receiveShadow = true;
	mesh.castShadow = false;
	mesh.frustumCulled = false;
	scene.add( mesh );
	return mesh;
} )();

// ---------------------------------------------------------------------------
// Bäume – Fichten & Laubbäume, Kronen schwanken im Wind (auch im Schatten!)
// ---------------------------------------------------------------------------

function tagTree( geo, base, height, rnd ) {
	const n = geo.attributes.position.count;
	const arr = new Float32Array( n * 4 );
	for ( let i = 0; i < n; i ++ ) {
		arr[ i * 4 ] = base.x; arr[ i * 4 + 1 ] = base.y; arr[ i * 4 + 2 ] = base.z; arr[ i * 4 + 3 ] = height + rnd;
	}
	geo.setAttribute( 'aTree', new THREE.BufferAttribute( arr, 4 ) );
	return geo;
}

function lumpy( geo, amount, seed ) {
	const p = geo.attributes.position;
	const v = new THREE.Vector3();
	for ( let i = 0; i < p.count; i ++ ) {
		v.fromBufferAttribute( p, i );
		const f = 1 + amount * ( Math.sin( v.x * 3.1 + seed ) * Math.sin( v.y * 2.7 + seed * 2 ) * Math.sin( v.z * 3.3 + seed * 3 ) );
		v.multiplyScalar( f );
		p.setXYZ( i, v.x, v.y, v.z );
	}
	geo.computeVertexNormals();
	return geo;
}

const trunks = [], needles = [], leaves = [];
const treeSpots = [];
function spotFree( x, z, d ) {
	for ( const s of treeSpots ) if ( ( s.x - x ) ** 2 + ( s.z - z ) ** 2 < d * d ) return false;
	return true;
}

for ( let tries = 0; treeSpots.length < ( LOW ? 340 : 520 ) && tries < 20000; tries ++ ) {
	const a = rand() * Math.PI * 2;
	const r = CLEARING + 1.5 + Math.pow( rand(), 1.3 ) * 110;
	const x = Math.cos( a ) * r, z = Math.sin( a ) * r;
	if ( ! spotFree( x, z, r < 40 ? 3.2 : 4.2 ) ) continue;
	treeSpots.push( { x, z } );

	const y = terrainHeight( x, z ) - 0.2;
	const base = new THREE.Vector3( x, y, z );
	const conifer = rand() < 0.62;
	const s = rr( 0.75, 1.35 );
	const rot = rand() * Math.PI * 2;
	const rnd = rand() * 0.99;

	if ( conifer ) {
		const H = Math.round( 11 * s );
		const tr = new THREE.CylinderGeometry( 0.12 * s, 0.3 * s, H * 0.55, 7 );
		tr.translate( 0, H * 0.275, 0 );
		trunks.push( tagTree( tr.rotateY( rot ).translate( x, y, z ), base, H, rnd ) );
		const layers = 5;
		for ( let l = 0; l < layers; l ++ ) {
			const t = l / ( layers - 1 );
			const rad = ( 2.6 - t * 1.9 ) * s;
			const ch = ( 4.2 - t * 1.6 ) * s;
			const cone = new THREE.ConeGeometry( rad, ch, LOW ? 8 : 11, LOW ? 1 : 2 );
			lumpy( cone, 0.08, l + x );
			cone.translate( 0, H * ( 0.22 + t * 0.62 ) + ch * 0.5, 0 );
			needles.push( tagTree( cone.rotateY( rot + l ).translate( x, y, z ), base, H, rnd ) );
		}
	} else {
		const H = Math.round( 10 * s );
		const tr = new THREE.CylinderGeometry( 0.18 * s, 0.38 * s, H * 0.7, 8 );
		tr.translate( 0, H * 0.35, 0 );
		trunks.push( tagTree( tr.rotateY( rot ).translate( x, y, z ), base, H, rnd ) );
		const blobs = 4 + Math.floor( rand() * 3 );
		for ( let k = 0; k < blobs; k ++ ) {
			const br = rr( 1.8, 2.8 ) * s;
			const ico = lumpy( new THREE.IcosahedronGeometry( br, LOW ? 1 : 2 ), 0.18, k * 7 + x );
			ico.translate( rr( - 1.6, 1.6 ) * s, H * rr( 0.62, 0.92 ), rr( - 1.6, 1.6 ) * s );
			leaves.push( tagTree( ico.rotateY( rot ).translate( x, y, z ), base, H, rnd ) );
		}
	}
}

// Umgestürzter Baumstamm auf der Lichtung (schöner Schattenwerfer)
{
	const log = new THREE.CylinderGeometry( 0.35, 0.42, 7, 12 );
	log.rotateZ( Math.PI / 2 ).rotateY( 0.5 ).translate( - 3.5, terrainHeight( - 3.5, - 3 ) + 0.3, - 3 );
	const lx = Math.cos( 0.5 ) * 3.5, lz = - Math.sin( 0.5 ) * 3.5;
	obstacles.push( { ax: - 3.5 - lx, az: - 3 - lz, bx: - 3.5 + lx, bz: - 3 + lz, r: 0.75 } );
	trunks.push( tagTree( log, new THREE.Vector3( 0, 50, 0 ), 1, 0 ) ); // aTree.y hoch -> kein Schwanken
}

function swayNode( amount ) {
	const aTree = attribute( 'aTree', 'vec4' );
	const H = aTree.w.floor();
	const rnd = aTree.w.fract();
	const rel = positionLocal.y.sub( aTree.y ).div( H ).clamp( 0, 1 );
	const w = windAt( aTree.xz, float( 1.3 ).add( rnd ) ).mul( amount ).mul( rel.mul( rel ) ).mul( H.mul( 0.035 ) );
	return positionLocal.add( vec3( U.windDir.x.mul( w ), 0, U.windDir.y.mul( w ) ) );
}

function foliageMaterial( dark, light, scale ) {
	const mat = new THREE.MeshStandardNodeMaterial( { roughness: 0.85, flatShading: false } );
	mat.positionNode = swayNode( 1.0 );
	const n = mx_fractal_noise_float( positionWorld.mul( scale ), 3 ).mul( 0.5 ).add( 0.5 );
	const aTree = attribute( 'aTree', 'vec4' );
	const tint = aTree.w.fract().mul( 0.35 ).add( 0.8 );
	const c = mix( vec3( ...dark ), vec3( ...light ), n ).mul( tint );
	// Selbstverschattung: unten/innen dunkler
	const heightAO = positionWorld.y.sub( aTree.y ).div( aTree.w.floor() ).clamp( 0, 1 ).mul( 0.6 ).add( 0.4 );
	mat.colorNode = c.mul( heightAO );
	// Gegenlicht-Transluzenz
	const viewDir = normalize( positionWorld.sub( cameraPosition ) );
	const back = pow( max( dot( viewDir, U.sunDir ), 0 ), 4 );
	mat.emissiveNode = c.mul( U.sunColor ).mul( back.mul( U.translucency ).mul( 0.6 ) );
	return mat;
}

const barkMat = new THREE.MeshStandardNodeMaterial( { roughness: 1 } );
{
	barkMat.positionNode = swayNode( 0.4 );
	const p = positionWorld;
	const stripes = mx_noise_float( vec3( p.x.mul( 6 ), p.y.mul( 0.6 ), p.z.mul( 6 ) ) ).mul( 0.5 ).add( 0.5 );
	const fine = mx_noise_float( p.mul( 14 ) ).mul( 0.5 ).add( 0.5 );
	const moss = smoothstep( 0.55, 0.85, normalWorld.y.mul( 0.5 ).add( fine.mul( 0.4 ) ).add( float( 1 ).sub( smoothstep( 0.0, 1.5, p.y.sub( attribute( 'aTree', 'vec4' ).y ) ) ).mul( 0.4 ) ) );
	const bark = mix( vec3( 0.12, 0.08, 0.05 ), vec3( 0.28, 0.21, 0.15 ), stripes.mul( fine ) );
	barkMat.colorNode = mix( bark, vec3( 0.12, 0.2, 0.05 ), moss );
}

const needleMat = foliageMaterial( [ 0.02, 0.07, 0.03 ], [ 0.06, 0.16, 0.06 ], 1.6 );
const leafMat = foliageMaterial( [ 0.06, 0.16, 0.03 ], [ 0.22, 0.38, 0.07 ], 1.1 );

for ( const [ list, mat ] of [ [ trunks, barkMat ], [ needles, needleMat ], [ leaves, leafMat ] ] ) {
	const geo = mergeGeometries( list.map( g => ( g.index ? g.toNonIndexed() : g ) ) );
	const mesh = new THREE.Mesh( geo, mat );
	mesh.castShadow = true;
	mesh.receiveShadow = true;
	mesh.frustumCulled = false;
	scene.add( mesh );
}

// Felsen mit Moos (Moos wächst im Shader auf nach oben zeigenden Flächen)

{
	const rockMat = new THREE.MeshStandardNodeMaterial( { roughness: 0.9, flatShading: true } );
	const p = positionWorld;
	const n = mx_fractal_noise_float( p.mul( 2.5 ), 3 ).mul( 0.5 ).add( 0.5 );
	const stone = mix( vec3( 0.22, 0.22, 0.21 ), vec3( 0.45, 0.44, 0.41 ), n );
	const moss = smoothstep( 0.35, 0.75, normalWorld.y.add( n.mul( 0.5 ).sub( 0.2 ) ) );
	rockMat.colorNode = mix( stone, vec3( 0.13, 0.24, 0.05 ), moss );
	rockMat.roughnessNode = mix( float( 0.75 ), float( 1.0 ), moss );

	const spots = [ [ 5, 2, 1.2 ], [ 6.2, 3.4, 0.6 ], [ - 6, 5, 0.9 ], [ 2, - 8, 1.6 ], [ - 9, - 6, 0.7 ], [ 9, - 5, 1.0 ], [ - 2, 9, 0.5 ] ];
	for ( const [ x, z, s ] of spots ) {
		const g = lumpy( new THREE.DodecahedronGeometry( 1, 1 ), 0.22, x * z );
		g.scale( s * 1.3, s * 0.8, s );
		const m = new THREE.Mesh( g, rockMat );
		m.position.set( x, terrainHeight( x, z ) + s * 0.25, z );
		m.rotation.y = rand() * 6;
		m.castShadow = m.receiveShadow = true;
		scene.add( m );

}

// ---------------------------------------------------------------------------
// Blumen & schwebende Glühwürmchen (HDR-Emission -> Bloom)

{
	const parts = [];
	const colors = [ [ 1, 1, 1 ], [ 1, 0.85, 0.2 ], [ 0.6, 0.4, 1 ], [ 1, 0.4, 0.5 ] ];
	for ( let i = 0; i < 900; i ++ ) {
		const a = rand() * Math.PI * 2, r = Math.sqrt( rand() ) * CLEARING * 0.95;
		const x = Math.cos( a ) * r, z = Math.sin( a ) * r;
		const y = terrainHeight( x, z ) + rr( 0.2, 0.5 );
		const g = new THREE.IcosahedronGeometry( rr( 0.03, 0.06 ), 0 );
		g.scale( 1, 0.5, 1 ).translate( x, y, z );
		const c = colors[ Math.floor( rand() * colors.length ) ];
		const n = g.attributes.position.count;
		const col = new Float32Array( n * 3 ), wnd = new Float32Array( n * 3 );
		for ( let k = 0; k < n; k ++ ) {
			col.set( c, k * 3 );
			wnd.set( [ x, z, ( y - terrainHeight( x, z ) ) / 0.65 ], k * 3 );
		}
		g.setAttribute( 'color', new THREE.BufferAttribute( col, 3 ) );
		g.setAttribute( 'aWind', new THREE.BufferAttribute( wnd, 3 ) );
		parts.push( g );
	}
	const geo = mergeGeometries( parts );
	const mat = new THREE.MeshStandardNodeMaterial( { vertexColors: true, roughness: 0.6 } );
	const aWind = attribute( 'aWind', 'vec3' );
	const bend = aWind.z.mul( aWind.z ).mul( windAt( aWind.xy, 3.1 ) ).mul( 0.35 );
	mat.positionNode = positionLocal.add( vec3( U.windDir.x.mul( bend ), 0, U.windDir.y.mul( bend ) ) );
	const flowers = new THREE.Mesh( geo, mat );
	flowers.receiveShadow = true;
	flowers.frustumCulled = false;
	scene.add( flowers );
}

const fireflies = ( () => {
	const parts = [];
	for ( let i = 0; i < 260; i ++ ) {
		const a = rand() * Math.PI * 2, r = Math.sqrt( rand() ) * CLEARING * 1.3;
		const x = Math.cos( a ) * r, z = Math.sin( a ) * r;
		const y = terrainHeight( x, z ) + rr( 0.4, 3.0 );
		const g = new THREE.OctahedronGeometry( 0.025, 0 );
		g.deleteAttribute( 'uv' );
		const n = g.attributes.position.count;
		const pa = new Float32Array( n * 4 );
		const phase = rand() * 100; // eine Phase pro Glühwürmchen, nicht pro Eckpunkt
		for ( let k = 0; k < n; k ++ ) pa.set( [ x, y, z, phase ], k * 4 );
		g.setAttribute( 'aP', new THREE.BufferAttribute( pa, 4 ) );
		parts.push( g );
	}
	const geo = mergeGeometries( parts );
	const mat = new THREE.MeshBasicNodeMaterial();
	const aP = attribute( 'aP', 'vec4' );
	const ph = aP.w;
	const t = time.mul( 0.6 );
	const drift = vec3(
		sin( t.mul( 0.7 ).add( ph ) ).mul( 0.8 ).add( sin( t.mul( 1.9 ).add( ph.mul( 3 ) ) ).mul( 0.15 ) ),
		sin( t.mul( 0.9 ).add( ph.mul( 2 ) ) ).mul( 0.35 ),
		cos( t.mul( 0.6 ).add( ph.mul( 1.3 ) ) ).mul( 0.8 )
	);
	mat.positionNode = positionLocal.add( aP.xyz ).add( drift );
	const blink = smoothstep( 0.2, 1.0, sin( time.mul( 2.0 ).add( ph.mul( 7 ) ) ).mul( 0.5 ).add( 0.5 ) ).add( 0.08 );
	mat.colorNode = vec3( 1.0, 0.8, 0.3 ).mul( blink ).mul( U.fireflyGlow );
	const mesh = new THREE.Mesh( geo, mat );
	mesh.frustumCulled = false;
	scene.add( mesh );
	return mesh;
} )();


// ---------------------------------------------------------------------------
// Laternen: warmes, flackerndes Licht, leuchtendes Glas (Bloom), Lichthof und Nachtfalter
// ---------------------------------------------------------------------------

const lanterns = ( () => {
	const spots = [ [ 10, 4 ], [ - 7, 8 ], [ - 11, - 1 ], [ - 1.5, - 1 ], [ 4, - 12 ], [ 12, - 4 ] ];
	const wood = [], metal = [], glass = [];
	const lights = [];
	const LAMP_Y = 1.88;

	// Flackern: zwei überlagerte Schwingungen + Zufallsphase je Laterne
	const flicker = ph => sin( time.mul( 11.0 ).add( ph ) ).mul( sin( time.mul( 6.7 ).add( ph.mul( 2.3 ) ) ) ).mul( 0.12 ).add( sin( time.mul( 23.0 ).add( ph.mul( 5.1 ) ) ).mul( 0.04 ) ).add( 0.88 );

	const tag = ( g, ph ) => {
		const n = g.attributes.position.count, a = new Float32Array( n );
		a.fill( ph );
		g.setAttribute( 'aPhase', new THREE.BufferAttribute( a, 1 ) );
		return g.index ? g.toNonIndexed() : g;
	};

	spots.forEach( ( [ x, z ], i ) => {
		const y = terrainHeight( x, z );
		const ph = i * 1.7 + 0.3;
		const place = g => g.translate( x, y, z );
		// Pfosten + Querholz
		wood.push( tag( place( new THREE.CylinderGeometry( 0.05, 0.07, 1.72, 8 ).translate( 0, 0.86, 0 ) ), ph ) );
		// Laternengehäuse: Boden, Eckstreben, Dach, Knauf
		metal.push( tag( place( new THREE.BoxGeometry( 0.27, 0.04, 0.27 ).translate( 0, 1.72, 0 ) ), ph ) );
		for ( const [ sx, sz ] of [ [ 1, 1 ], [ 1, - 1 ], [ - 1, 1 ], [ - 1, - 1 ] ] )
			metal.push( tag( place( new THREE.BoxGeometry( 0.025, 0.31, 0.025 ).translate( sx * 0.11, LAMP_Y, sz * 0.11 ) ), ph ) );
		metal.push( tag( place( new THREE.ConeGeometry( 0.22, 0.16, 4 ).rotateY( Math.PI / 4 ).translate( 0, 2.11, 0 ) ), ph ) );
		metal.push( tag( place( new THREE.SphereGeometry( 0.03, 8, 6 ).translate( 0, 2.21, 0 ) ), ph ) );
		// Glas (leuchtet)
		glass.push( tag( place( new THREE.BoxGeometry( 0.2, 0.28, 0.2 ).translate( 0, LAMP_Y, 0 ) ), ph ) );

		obstacles.push( { ax: x, az: z, bx: x, bz: z, r: 0.4 } );

		// echte Lichtquellen (auf schwachen Geräten nur jede zweite)
		if ( ! LOW || i % 2 === 0 ) {
			const light = new THREE.PointLight( 0xffa45c, 0, LOW ? 13 : 16, 2 );
			light.position.set( x, y + LAMP_Y, z );
			light.userData.phase = ph;
			scene.add( light );
			lights.push( light );
		}

		// Lichthof (Billboard mit weichem Verlauf)
		const haloMat = new THREE.SpriteNodeMaterial( { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending } );
		const d = uv().sub( 0.5 ).length().mul( 2 );
		const fall = pow( float( 1 ).sub( d ).clamp( 0, 1 ), 2.2 );
		haloMat.colorNode = vec3( 1.0, 0.6, 0.28 ).mul( U.lanternOn.mul( 0.55 ).mul( flicker( float( ph ) ) ) );
		haloMat.opacityNode = fall;
		const halo = new THREE.Sprite( haloMat );
		halo.position.set( x, y + LAMP_Y, z );
		halo.scale.setScalar( 2.4 );
		scene.add( halo );
	} );

	const phase = attribute( 'aPhase', 'float' );

	const woodMat = new THREE.MeshStandardNodeMaterial( { color: 0x3b2a1c, roughness: 0.9 } );
	const metalMat = new THREE.MeshStandardNodeMaterial( { color: 0x1d1d1f, roughness: 0.45, metalness: 0.7 } );
	const glassMat = new THREE.MeshBasicNodeMaterial();
	// tagsüber trübes Glas, nachts warmes HDR-Leuchten (> 1 -> Bloom)
	glassMat.colorNode = mix( vec3( 0.32, 0.3, 0.26 ), vec3( 1.0, 0.62, 0.3 ).mul( flicker( phase ).mul( 6.0 ) ), U.lanternOn.clamp( 0, 1 ) ).mul( U.lanternOn.max( 1 ) );

	for ( const [ list, mat, shadow ] of [ [ wood, woodMat, true ], [ metal, metalMat, true ], [ glass, glassMat, false ] ] ) {
		const m = new THREE.Mesh( mergeGeometries( list ), mat );
		m.castShadow = shadow;
		m.receiveShadow = true;
		scene.add( m );
	}

	// Nachtfalter, die um die Laternen kreisen
	const parts = [];
	spots.forEach( ( [ x, z ] ) => {
		for ( let k = 0; k < 6; k ++ ) {
			const g = new THREE.TetrahedronGeometry( 0.012, 0 );
			g.deleteAttribute( 'uv' );
			const n = g.attributes.position.count, a = new Float32Array( n * 4 );
			const ph = rand() * 100;
			for ( let j = 0; j < n; j ++ ) a.set( [ x, terrainHeight( x, z ) + LAMP_Y, z, ph ], j * 4 );
			g.setAttribute( 'aP', new THREE.BufferAttribute( a, 4 ) );
			parts.push( g );
		}
	} );
	const mothMat = new THREE.MeshBasicNodeMaterial();
	const aP = attribute( 'aP', 'vec4' );
	const t = time.mul( aP.w.fract().add( 1.2 ) ).add( aP.w );
	const radius = sin( t.mul( 0.7 ) ).mul( 0.15 ).add( 0.38 );
	mothMat.positionNode = positionLocal.add( aP.xyz ).add( vec3( cos( t.mul( 2.1 ) ).mul( radius ), sin( t.mul( 3.3 ) ).mul( 0.18 ), sin( t.mul( 2.1 ) ).mul( radius ) ) );
	mothMat.colorNode = vec3( 0.9, 0.7, 0.45 ).mul( U.lanternOn.min( 1 ).mul( 0.9 ) );
	const moths = new THREE.Mesh( mergeGeometries( parts ), mothMat );
	moths.frustumCulled = false;
	scene.add( moths );

	// pro Bild: Lichtstärke mit Flackern (gleiche Formel wie im Shader)
	function update() {
		const on = U.lanternOn.value;
		moths.visible = on > 0.02;
		const tt = performance.now() / 1000;
		for ( const l of lights ) {
			const ph = l.userData.phase;
			const f = Math.sin( tt * 11 + ph ) * Math.sin( tt * 6.7 + ph * 2.3 ) * 0.12 + Math.sin( tt * 23 + ph * 5.1 ) * 0.04 + 0.88;
			l.intensity = 9 * on * f; // Lichter bleiben sichtbar (Anzahl gleich -> keine Shader-Neuübersetzung)
		}
	}
	return { update, spots };
} )();

// ---------------------------------------------------------------------------
// Post-Processing-Pipeline: Kantenglättung + Bloom
// ---------------------------------------------------------------------------

const settings = {
	aa: 'MSAA 4x',
	pixelRatio: Math.min( window.devicePixelRatio, 2 ),
	bloom: true,
	bloomStrength: 0.35,
	bloomThreshold: 0.85,
	toneMapping: 'AgX',
	exposure: 1.0,
	shadows: true,
	shadowType: 'PCF (weich)',
	shadowRes: LOW ? 1024 : 2048,
	grassShadows: false,
	showShadowCam: false
};
const sound = { on: ! query.has( 'stumm' ), master: 0.8, wind: 0.5, birds: 0.8, crickets: 0.7, steps: 0.6 };

let pipeline, bloomPass;

function buildPipeline() {
	pipeline?.dispose?.();
	pipeline = new THREE.RenderPipeline( renderer );
	pipeline.outputColorTransform = false;

	const mode = settings.aa;
	const scenePass = pass( scene, camera, { samples: mode === 'MSAA 4x' ? 4 : 0 } );
	let color;
	if ( mode === 'TRAA (temporal)' ) {
		scenePass.setMRT( mrt( { output, velocity } ) );
		color = traa( scenePass.getTextureNode( 'output' ), scenePass.getTextureNode( 'depth' ), scenePass.getTextureNode( 'velocity' ), camera );
	} else {
		color = scenePass.getTextureNode( 'output' );
	}

	if ( settings.bloom ) {
		bloomPass = bloom( color, settings.bloomStrength, 0.4, settings.bloomThreshold );
		color = color.add( bloomPass );
	} else bloomPass = null;

	color = renderOutput( color );

	if ( mode === 'FXAA' ) color = fxaa( color );
	else if ( mode === 'SMAA' ) color = smaa( color );

	pipeline.outputNode = color;
}
buildPipeline();

// ---------------------------------------------------------------------------
// Bloom auch in VR
// three.js r187 hat für Post-Processing in WebXR keine offizielle Schnittstelle: RenderPipeline
// schaltet XR ab. In VR läuft aber ohnehin ein interner Output-Pass (Tone-Mapping-Quad), der das
// Bild aus einem Zwischenpuffer in die Brille kopiert. Diesen Pass erweitern wir um Bloom.
// Kantenglättung: in VR rendert der Zwischenpuffer mit MSAA 4x (wie am PC voreingestellt).
// ---------------------------------------------------------------------------

let xrBloom = null;
{
	const nodes = renderer._nodes;
	const origOutputNode = nodes.getOutputNode.bind( nodes );
	const origCacheKey = nodes.getOutputCacheKey.bind( nodes );
	const useXRBloom = () => renderer.xr.isPresenting && settings.bloom && ! query.has( 'nobloom' );

	nodes.getOutputCacheKey = () => origCacheKey() + ( useXRBloom() ? ':xrbloom' : '' );
	nodes.getOutputNode = function ( outputTarget ) {
		if ( ! useXRBloom() || outputTarget.isArrayTexture ) return origOutputNode( outputTarget ); // nicht bei Multiview
		const scene = texture( outputTarget, screenUV );
		xrBloom = bloom( scene, settings.bloomStrength, 0.4, settings.bloomThreshold );
		return scene.add( xrBloom ).renderOutput( renderer.toneMapping, renderer.currentColorSpace );
	};
}

{
	const handMat = new THREE.MeshStandardNodeMaterial( { color: 0x333333, roughness: 0.5 } );
	const handGeo = new THREE.BoxGeometry( 0.035, 0.035, 0.12 );
	for ( let i = 0; i < 2; i ++ ) {
		const grip = renderer.xr.getControllerGrip( i );
		grip.add( new THREE.Mesh( handGeo, handMat ) );
		rig.add( grip );
	}
}

const vrOpts = { walkSpeed: 2.2, snapDeg: 30 }; // im VR-Menü einstellbar
const UP = new THREE.Vector3( 0, 1, 0 );
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _head = new THREE.Vector3();
let snapReady = true;
const lastVRHead = new THREE.Vector3( 0, 0, 11 ); let lastVRYaw = 0; // für die Rückkehr aus VR

function stickOf( src ) {
	const a = src.gamepad ? src.gamepad.axes : [];
	return a.length >= 4 ? [ a[ 2 ], a[ 3 ] ] : [ a[ 0 ] || 0, a[ 1 ] || 0 ];
}
const dead = v => Math.abs( v ) < 0.15 ? 0 : v;

// verhindert, dass man durch Bäume, Felsen und den liegenden Stamm läuft
function pushOut( pos, cx, cz, rad ) {
	const dx = pos.x - cx, dz = pos.z - cz, d2 = dx * dx + dz * dz;
	if ( d2 < rad * rad && d2 > 1e-8 ) {
		const d = Math.sqrt( d2 ), k = ( rad - d ) / d;
		pos.x += dx * k; pos.z += dz * k;
	}
}
function pushOutOfTrees( pos ) {
	for ( const t of treeSpots ) pushOut( pos, t.x, t.z, 0.7 );
	for ( const o of obstacles ) {
		// nächster Punkt auf der Strecke a–b
		const ex = o.bx - o.ax, ez = o.bz - o.az, len2 = ex * ex + ez * ez;
		const t = len2 > 0 ? Math.max( 0, Math.min( 1, ( ( pos.x - o.ax ) * ex + ( pos.z - o.az ) * ez ) / len2 ) ) : 0;
		pushOut( pos, o.ax + ex * t, o.az + ez * t, o.r );
	}
	const r = Math.hypot( pos.x, pos.z );
	if ( r > 110 ) { pos.x *= 110 / r; pos.z *= 110 / r; }
}

function vrLocomotion( dt ) {
	if ( ! inVR ) return;
	const session = renderer.xr.getSession();
	if ( ! session ) return;
	pollMenuButton( session );
	let move = [ 0, 0 ], turn = 0;
	for ( const src of session.inputSources ) {
		if ( ! src.gamepad ) continue;
		if ( src.handedness === 'left' ) move = stickOf( src );
		else if ( src.handedness === 'right' ) turn = stickOf( src )[ 0 ];
	}

	const xrCam = renderer.xr.getCamera();
	// matrixWorld der XR-Kamera enthält schon das Rig (Position + Drehung); getWorldPosition() würde sie ohne Rig neu berechnen
	_head.setFromMatrixPosition( xrCam.matrixWorld );
	lastVRHead.copy( _head );
	_fwd.set( 0, 0, - 1 ).transformDirection( xrCam.matrixWorld );
	lastVRYaw = Math.atan2( - _fwd.x, - _fwd.z );
	const rx0 = rig.position.x, rz0 = rig.position.z;

	const mx = dead( move[ 0 ] ), my = dead( move[ 1 ] );
	if ( mx || my ) {
		_fwd.set( 0, 0, - 1 ).transformDirection( xrCam.matrixWorld );
		_fwd.y = 0;
		if ( _fwd.lengthSq() < 1e-4 ) _fwd.set( 0, 0, - 1 );
		_fwd.normalize();
		_right.set( - _fwd.z, 0, _fwd.x );
		rig.position.addScaledVector( _fwd, - my * vrOpts.walkSpeed * dt ).addScaledVector( _right, mx * vrOpts.walkSpeed * dt );
	}

	if ( snapReady && Math.abs( turn ) > 0.7 ) {
		snapReady = false;
		const angle = - Math.sign( turn ) * THREE.MathUtils.degToRad( vrOpts.snapDeg );
		// um die Kopfposition drehen, nicht um den Rig-Ursprung
		rig.position.sub( _head ).applyAxisAngle( UP, angle ).add( _head );
		rig.rotation.y += angle;
	} else if ( Math.abs( turn ) < 0.3 ) snapReady = true;

	// Kopf-Position nach der Bewegung abschätzen, Kollision + Gelände folgen
	if ( ! mx && ! my ) return;
	const hx = _head.x + rig.position.x - rx0, hz = _head.z + rig.position.z - rz0;
	const p = { x: hx, z: hz };
	pushOutOfTrees( p );
	rig.position.x += p.x - hx;
	rig.position.z += p.z - hz;
	rig.position.y = terrainHeight( p.x, p.z );
}

// --- Egoperspektive am PC -------------------------------------------------
//   Klick ins Bild: Maus wird eingefangen (Pointer Lock) -> Maus = umsehen
//   W/A/S/D oder Pfeiltasten = laufen, Shift = rennen, Leertaste = springen, Esc = Maus frei (Menü)
//   Ohne Pointer Lock geht Umsehen auch mit gedrückter linker Maustaste.

const EYE = 1.7, WALK = 3.0, RUN = 7.0, JUMP = 5.5, GRAVITY = 16;
const player = { pos: new THREE.Vector3( 0, 0, 11 ), vel: new THREE.Vector3(), vy: 0, y: 0, yaw: 0, pitch: - 0.05, onGround: true, bob: 0 };
player.y = terrainHeight( player.pos.x, player.pos.z );

const keys = new Set();
const isGuiEvent = e => !! e.target.closest?.( '.lil-gui' );
window.addEventListener( 'keydown', e => {
	if ( isGuiEvent( e ) ) return;
	keys.add( e.code );
	if ( e.code === 'Space' && player.onGround && ! renderer.xr.isPresenting ) { player.vy = JUMP; player.onGround = false; }
	if ( [ 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight' ].includes( e.code ) ) e.preventDefault();
} );
window.addEventListener( 'keyup', e => keys.delete( e.code ) );
window.addEventListener( 'blur', () => keys.clear() );

const hint = document.getElementById( 'hint' );
let dragging = false;
function look( dx, dy ) {
	player.yaw -= dx * 0.0022;
	player.pitch = THREE.MathUtils.clamp( player.pitch - dy * 0.0022, - 1.45, 1.45 );
}
renderer.domElement.addEventListener( 'mousedown', e => {
	if ( e.button !== 0 ) return;
	dragging = true;
	hint.style.display = 'none';
	try {
		const r = renderer.domElement.requestPointerLock();
		if ( r && r.catch ) r.catch( () => {} );
	} catch ( err ) { /* Pointer Lock nicht verfügbar -> Ziehen mit gedrückter Maus */ }
} );
window.addEventListener( 'mouseup', () => { dragging = false; } );
window.addEventListener( 'mousemove', e => {
	if ( renderer.xr.isPresenting ) return;
	if ( document.pointerLockElement === renderer.domElement || dragging ) look( e.movementX, e.movementY );
} );
document.addEventListener( 'pointerlockchange', () => {
	hint.style.display = document.pointerLockElement ? 'none' : 'block';
} );

function applyPlayerCamera( dt ) {
	// leichtes Kopfwippen beim Gehen
	const speed = Math.hypot( player.vel.x, player.vel.z );
	if ( player.onGround && speed > 0.3 ) player.bob += dt * speed * 2.2;
	const bob = Math.sin( player.bob ) * 0.035 * Math.min( speed / WALK, 1.5 );
	camera.position.set( player.pos.x, player.y + EYE + bob, player.pos.z );
	camera.rotation.set( player.pitch, player.yaw, 0 );
}

function desktopMove( dt ) {
	let f = 0, r = 0;
	if ( keys.has( 'KeyW' ) || keys.has( 'ArrowUp' ) ) f += 1;
	if ( keys.has( 'KeyS' ) || keys.has( 'ArrowDown' ) ) f -= 1;
	if ( keys.has( 'KeyD' ) || keys.has( 'ArrowRight' ) ) r += 1;
	if ( keys.has( 'KeyA' ) || keys.has( 'ArrowLeft' ) ) r -= 1;
	const run = keys.has( 'ShiftLeft' ) || keys.has( 'ShiftRight' );

	// Laufrichtung nur aus dem Yaw: Hoch-/Runterschauen ändert die Richtung nicht
	_fwd.set( - Math.sin( player.yaw ), 0, - Math.cos( player.yaw ) );
	_right.set( - _fwd.z, 0, _fwd.x );
	const target = new THREE.Vector3().addScaledVector( _fwd, f ).addScaledVector( _right, r );
	if ( target.lengthSq() > 1 ) target.normalize();
	target.multiplyScalar( run ? RUN : WALK );

	// sanft beschleunigen/abbremsen (in der Luft weniger Kontrolle)
	const accel = player.onGround ? 12 : 3;
	player.vel.lerp( target, 1 - Math.exp( - accel * dt ) );

	const p = { x: player.pos.x + player.vel.x * dt, z: player.pos.z + player.vel.z * dt };
	pushOutOfTrees( p );
	player.pos.x = p.x; player.pos.z = p.z;

	// Springen / Schwerkraft / Boden
	const ground = terrainHeight( player.pos.x, player.pos.z );
	player.vy -= GRAVITY * dt;
	player.y += player.vy * dt;
	if ( player.y <= ground ) { player.y = ground; player.vy = 0; player.onGround = true; }

	applyPlayerCamera( dt );
}
applyPlayerCamera( 0 );

// ---------------------------------------------------------------------------
// Geräusche – komplett im Browser erzeugt (Web Audio API), keine Audiodateien, keine Lizenzfragen
//   Wind + Blätterrauschen: gefiltertes Rauschen, folgt Windstärke/Windtempo
//   Vögel: synthetische Gesänge, räumlich (PositionalAudio) in Baumkronen rund um die Lichtung
//   Grillen: bei tief stehender Sonne; Schritte: beim Laufen (PC und VR)
//   Browser erlauben Ton erst nach einer Nutzeraktion -> Start beim ersten Klick/Tastendruck
// ---------------------------------------------------------------------------

const listener = new THREE.AudioListener();
camera.add( listener );
const actx = listener.context;
listener.setMasterVolume( 0 );

const rnd = ( a, b ) => a + Math.random() * ( b - a );
const pick = arr => arr[ Math.floor( Math.random() * arr.length ) ];

// 4 s weißes Rauschen als Schleife – Grundstoff für Wind, Blätter und Schritte
const noiseBuf = ( () => {
	const len = actx.sampleRate * 4, buf = actx.createBuffer( 1, len, actx.sampleRate ), d = buf.getChannelData( 0 );
	for ( let i = 0; i < len; i ++ ) d[ i ] = Math.random() * 2 - 1;
	return buf;
} )();
function noiseSource() {
	const s = actx.createBufferSource();
	s.buffer = noiseBuf;
	s.loop = true;
	s.start( 0, Math.random() * 3 );
	return s;
}

const busWind = actx.createGain(), busCrickets = actx.createGain(), busSteps = actx.createGain();
for ( const b of [ busWind, busCrickets, busSteps ] ) b.connect( listener.getInput() );

// --- Wind & Blätter: zwei Schichten, links/rechts leicht verschieden für räumliche Breite
//   Kein tiefes Rauschen (klingt nach Brandung), Böen zufällig statt gleichmäßig an- und abschwellend
const windLayers = [ - 0.6, 0.6 ].map( () => {
	const panner = actx.createStereoPanner();
	panner.connect( busWind );

	const hp = actx.createBiquadFilter();
	hp.type = 'highpass'; hp.frequency.value = 250; hp.Q.value = 0.5;
	const body = actx.createBiquadFilter();
	body.type = 'bandpass'; body.frequency.value = 900; body.Q.value = 0.6;
	const bodyGain = actx.createGain(); bodyGain.gain.value = 0;
	noiseSource().connect( hp ).connect( body ).connect( bodyGain ).connect( panner );

	const leaf = actx.createBiquadFilter();
	leaf.type = 'bandpass'; leaf.frequency.value = 3500; leaf.Q.value = 0.6;
	const leafGain = actx.createGain(); leafGain.gain.value = 0;
	noiseSource().connect( leaf ).connect( leafGain ).connect( panner );

	return { panner, body, bodyGain, leaf, leafGain, from: 0.3, to: 0.3, tt: 0, dur: 2, flut: 0.5, flutTo: 0.5 };
} );
windLayers[ 0 ].panner.pan.value = - 0.6;
windLayers[ 1 ].panner.pan.value = 0.6;

// weich überblendete Zufallswerte: neue Böe alle 1,5–5 s (unregelmäßig)
function gustOf( L, dt ) {
	L.tt += dt * Math.max( U.windSpeed.value, 0.1 );
	if ( L.tt >= L.dur ) {
		L.tt = 0; L.from = L.to; L.to = Math.pow( Math.random(), 1.6 ); L.dur = rnd( 1.5, 5 );
	}
	const k = L.tt / L.dur, sm = k * k * ( 3 - 2 * k );
	// schnelles, zufälliges Blätterflattern
	if ( Math.random() < dt * 6 ) L.flutTo = Math.random();
	L.flut += ( L.flutTo - L.flut ) * Math.min( 1, dt * 10 );
	return L.from + ( L.to - L.from ) * sm;
}

function updateWind( dt ) {
	const strength = U.windStrength.value * ( 1 - 0.4 * U.night.value ); // nachts ruhiger
	const now = actx.currentTime;
	for ( const L of windLayers ) {
		const gust = gustOf( L, dt );
		L.bodyGain.gain.setTargetAtTime( strength * ( 0.012 + 0.07 * gust ), now, 0.25 );
		L.body.frequency.setTargetAtTime( 600 + 900 * gust * Math.min( strength, 2 ), now, 0.3 );
		L.leafGain.gain.setTargetAtTime( strength * ( 0.006 + 0.05 * gust ) * ( 0.6 + 0.4 * L.flut ), now, 0.06 );
		L.leaf.frequency.setTargetAtTime( 2600 + 1800 * gust, now, 0.2 );
	}
}

// --- Bausteine für Vogelstimmen und Grillen: ein Ton mit Tonhöhen-Gleiten und Hüllkurve
function tone( dest, t, dur, f0, f1, vol, type = 'sine', vib = null ) {
	const o = actx.createOscillator();
	o.type = type;
	o.frequency.setValueAtTime( f0, t );
	o.frequency.exponentialRampToValueAtTime( f1, t + dur );
	const g = actx.createGain();
	g.gain.setValueAtTime( 0.0001, t );
	g.gain.exponentialRampToValueAtTime( vol, t + Math.min( 0.015, dur * 0.3 ) );
	g.gain.exponentialRampToValueAtTime( 0.0001, t + dur );
	if ( vib ) {
		const lfo = actx.createOscillator(), lg = actx.createGain();
		lfo.frequency.value = vib[ 0 ]; lg.gain.value = vib[ 1 ];
		lfo.connect( lg ).connect( o.frequency );
		lfo.start( t ); lfo.stop( t + dur + 0.05 );
	}
	o.connect( g ).connect( dest );
	o.start( t ); o.stop( t + dur + 0.05 );
}

// Gesänge: geben die Dauer in Sekunden zurück
const SONGS = {
	// Meise: „zi-zi-bä“, mehrfach
	meise( d, t ) {
		const reps = 2 + Math.floor( rnd( 0, 3 ) ), hi = rnd( 5600, 6400 );
		for ( let k = 0; k < reps; k ++ ) {
			const o = t + k * 0.42;
			tone( d, o, 0.06, hi, hi * 0.9, 0.25 );
			tone( d, o + 0.11, 0.06, hi, hi * 0.9, 0.25 );
			tone( d, o + 0.22, 0.15, hi * 0.6, hi * 0.56, 0.3 );
		}
		return reps * 0.42;
	},
	// Zaunkönig-artiger Triller: viele kurze, schnelle Töne
	triller( d, t ) {
		const n = 14 + Math.floor( rnd( 0, 12 ) );
		let f = rnd( 4200, 5200 ), o = t;
		for ( let k = 0; k < n; k ++ ) {
			f = THREE.MathUtils.clamp( f + rnd( - 500, 500 ), 3500, 7000 );
			tone( d, o, 0.032, f * 1.08, f * 0.92, 0.18, 'triangle' );
			o += 0.045 + ( k % 5 === 4 ? 0.04 : 0 );
		}
		return o - t;
	},
	// Amsel-artig: flötende, gleitende Töne, am Ende leises Zwitschern
	amsel( d, t ) {
		const scale = [ 1700, 1900, 2150, 2400, 2700, 3000, 3300 ];
		const n = 4 + Math.floor( rnd( 0, 4 ) );
		let o = t;
		for ( let k = 0; k < n; k ++ ) {
			const f = pick( scale ), dur = rnd( 0.12, 0.32 );
			tone( d, o, dur, f, f * rnd( 0.85, 1.18 ), 0.35, 'sine', [ rnd( 18, 30 ), f * 0.012 ] );
			o += dur + rnd( 0.03, 0.09 );
		}
		for ( let k = 0; k < 3; k ++ ) { tone( d, o, 0.04, 5200, 4600, 0.08 ); o += 0.06; }
		return o - t;
	},
	// Buchfink-artig: absteigender, schneller werdender Triller mit Schnörkel
	fink( d, t ) {
		let o = t, f = rnd( 5400, 6000 ), gap = 0.11;
		for ( let k = 0; k < 10; k ++ ) {
			tone( d, o, 0.05, f, f * 0.85, 0.22 );
			o += gap; gap *= 0.9; f *= 0.95;
		}
		tone( d, o + 0.03, 0.12, 3200, 4800, 0.28 );
		tone( d, o + 0.18, 0.18, 4800, 2600, 0.28 );
		return o + 0.4 - t;
	},
	// Kuckuck: weit entfernt, zwei fallende Töne
	// Waldkauz: „huuu … hu-hu-huuuu“ (nur nachts)
	kauz( d, t ) {
		tone( d, t, 0.7, 560, 520, 0.6, 'sine', [ 5, 6 ] );
		tone( d, t + 1.6, 0.14, 540, 520, 0.4 );
		tone( d, t + 1.85, 0.14, 540, 520, 0.4 );
		tone( d, t + 2.1, 1.1, 580, 500, 0.6, 'sine', [ 14, 18 ] );
		return 3.3;
	},
	kuckuck( d, t ) {
		const reps = 4 + Math.floor( rnd( 0, 5 ) );
		for ( let k = 0; k < reps; k ++ ) {
			const o = t + k * 0.95;
			tone( d, o, 0.22, 780, 750, 0.6, 'sine', [ 6, 4 ] );
			tone( d, o + 0.3, 0.34, 640, 610, 0.6, 'sine', [ 6, 4 ] );
		}
		return reps * 0.95;
	}
};

// --- Vögel in Baumkronen am Rand der Lichtung (+ ein Kuckuck weit weg)
const birds = [];
{
	const near = treeSpots.filter( s => { const r = Math.hypot( s.x, s.z ); return r > 15 && r < 40; } ).sort( () => Math.random() - 0.5 );
	const far = treeSpots.filter( s => Math.hypot( s.x, s.z ) > 60 );
	const kinds = [ 'meise', 'amsel', 'triller', 'fink', 'meise', 'amsel', 'fink' ];
	const spots = kinds.map( ( k, i ) => [ k, near[ i ] ] ).filter( e => e[ 1 ] );
	if ( far.length ) spots.push( [ 'kuckuck', pick( far ) ] );
	const mid = treeSpots.filter( s => { const r = Math.hypot( s.x, s.z ); return r > 30 && r < 60; } );
	if ( mid.length ) spots.push( [ 'kauz', pick( mid ) ] );
	for ( const [ kind, s ] of spots ) {
		const pa = new THREE.PositionalAudio( listener );
		const input = actx.createGain();
		pa.setNodeSource( input );
		pa.setDistanceModel( 'inverse' );
		pa.setRefDistance( kind === 'kuckuck' ? 22 : kind === 'kauz' ? 18 : 12 );
		pa.setRolloffFactor( 0.8 );
		pa.position.set( s.x, terrainHeight( s.x, s.z ) + rnd( 5, 9 ), s.z );
		scene.add( pa );
		birds.push( { kind, pa, input, next: rnd( 1, 8 ) } );
	}
}

// --- Grillen: kurze Pulsgruppen um 4,5 kHz, links/rechts verteilt
const crickets = [ - 0.8, 0.1, 0.9 ].map( pan => {
	const p = actx.createStereoPanner();
	p.pan.value = pan;
	p.connect( busCrickets );
	return { out: p, f: rnd( 4200, 4900 ), next: rnd( 0, 1 ), period: rnd( 0.42, 0.62 ) };
} );

// --- Schritte: kurzer gefilterter Rauschimpuls („Gras knistert“)
function footstep( vol ) {
	const t = actx.currentTime + 0.01;
	for ( const [ delay, f, v, len ] of [ [ 0, rnd( 900, 1600 ), vol, 0.16 ], [ 0.045, rnd( 2200, 3400 ), vol * 0.5, 0.1 ] ] ) {
		const src = actx.createBufferSource();
		src.buffer = noiseBuf;
		const bp = actx.createBiquadFilter();
		bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 0.9;
		const g = actx.createGain();
		g.gain.setValueAtTime( 0.0001, t + delay );
		g.gain.exponentialRampToValueAtTime( v, t + delay + 0.012 );
		g.gain.exponentialRampToValueAtTime( 0.0001, t + delay + len );
		src.connect( bp ).connect( g ).connect( busSteps );
		src.start( t + delay, Math.random() * 3, len + 0.05 );
	}
}

let lastStepPhase = 0, wasOnGround = true, vrStepDist = 0;
const lastRigPos = new THREE.Vector3();
function updateSteps() {
	if ( renderer.xr.isPresenting ) {
		const d = Math.hypot( rig.position.x - lastRigPos.x, rig.position.z - lastRigPos.z );
		if ( d < 1 ) vrStepDist += d; // große Sprünge (Snap-Turn/Start) nicht zählen
		lastRigPos.copy( rig.position );
		if ( vrStepDist > 0.75 ) { vrStepDist = 0; footstep( 0.5 ); }
		return;
	}
	lastRigPos.copy( rig.position );
	const phase = Math.floor( player.bob / Math.PI );
	if ( phase !== lastStepPhase && player.onGround ) {
		const speed = Math.hypot( player.vel.x, player.vel.z );
		footstep( Math.min( 0.35 + speed * 0.08, 0.9 ) );
	}
	lastStepPhase = phase;
	if ( player.onGround && ! wasOnGround ) footstep( 0.9 ); // Landung nach Sprung
	wasOnGround = player.onGround;
}

// --- Steuerung pro Bild: Lautstärken, Tageszeit, Gesänge vorausplanen
function updateSound( dt ) {
	if ( actx.state !== 'running' ) return;
	listener.setMasterVolume( sound.on ? sound.master : 0 );
	busWind.gain.value = sound.wind;
	busSteps.gain.value = sound.steps;

	const day = THREE.MathUtils.smoothstep( params.sunElevation, 3, 15 );
	const night = 1 - THREE.MathUtils.smoothstep( params.sunElevation, 6, 20 );
	busCrickets.gain.setTargetAtTime( sound.crickets * night * 1.0, actx.currentTime, 0.5 );

	updateWind( dt );
	updateSteps();

	const now = actx.currentTime;
	for ( const b of birds ) {
		b.pa.setVolume( sound.birds );
		if ( now + 0.3 < b.next ) continue;
		let pause;
		if ( b.kind === 'kauz' ) {
			if ( U.night.value > 0.5 && Math.random() < 0.7 ) {
				const dur = SONGS.kauz( b.input, Math.max( b.next, now + 0.05 ) );
				b.next = Math.max( b.next, now ) + dur + rnd( 12, 30 );
			} else b.next = now + rnd( 5, 10 );
			continue;
		}
		if ( day > 0.05 && Math.random() < 0.3 + 0.7 * day ) {
			const dur = SONGS[ b.kind ]( b.input, Math.max( b.next, now + 0.05 ) );
			pause = b.kind === 'kuckuck' ? rnd( 20, 45 ) : rnd( 3, 12 ) / ( 0.3 + day );
			b.next = Math.max( b.next, now ) + dur + pause;
		} else {
			b.next = now + rnd( 4, 10 ); // in der Dämmerung schweigen die meisten Vögel
		}
	}

	if ( night > 0.02 ) {
		for ( const c of crickets ) {
			if ( now + 0.3 < c.next ) continue;
			const t = Math.max( c.next, now + 0.02 );
			const pulses = 3 + Math.floor( rnd( 0, 2 ) );
			for ( let k = 0; k < pulses; k ++ ) tone( c.out, t + k * 0.034, 0.022, c.f, c.f * 0.99, 0.25 );
			c.next = t + c.period * rnd( 0.9, 1.1 );
		}
	}
}

// Ton freischalten: Browser erlauben Audio erst nach einer Nutzeraktion
function unlockAudio() {
	if ( actx.state !== 'running' ) actx.resume();
}
for ( const ev of [ 'pointerdown', 'keydown', 'touchstart' ] ) window.addEventListener( ev, unlockAudio, { capture: true } );
renderer.xr.addEventListener( 'sessionstart', unlockAudio );

// ---------------------------------------------------------------------------
// Info-Anzeige, Resize, Render-Loop
// ---------------------------------------------------------------------------

const info = document.getElementById( 'info' );
let fps = 0, frames = 0, lastT = performance.now();

function updateInfo() {
	const backend = renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL 2';
	const xr = renderer.xr.isPresenting ? `VR aktiv (${ backend }) – AA: MSAA 4x${ settings.bloom ? ' + Bloom' : '' }` : `AA: ${ settings.aa }`;
	info.innerHTML = `<b>${ backend }</b>  ·  ${ fps } FPS\n${ xr }\n` +
		`Schatten: ${ settings.shadowType }, ${ settings.shadowRes }²\n` +
		( renderer.xr.isPresenting ? `Linker Stick: laufen · Rechter Stick: drehen · A/B/X/Y: Menü` : `Esc: Maus frei für das Menü` );
}

window.addEventListener( 'resize', () => {
	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize( window.innerWidth, window.innerHeight );
} );

updateSun();
updateInfo();

let prevT = performance.now(), vrTimeRefresh = 0;
function animate() {
	frames ++;
	const now = performance.now();
	const dt = Math.min( ( now - prevT ) / 1000, 0.1 );
	prevT = now;

	if ( params.cycle ) {
		params.time = ( params.time + dt * 24 / ( params.dayMinutes * 60 ) ) % 24;
		updateSun();
		// VR-Menü-Anzeige nur 1× pro Sekunde auffrischen (Neuzeichnen der Menüfläche kostet)
		vrTimeRefresh += dt;
		if ( vrMenuOpen && vrTimeRefresh > 1 ) { vrTimeRefresh = 0; vrTimeCtrl.updateDisplay(); }
	}
	lanterns.update();
	if ( now - lastT > 500 ) {
		fps = Math.round( frames * 1000 / ( now - lastT ) );
		frames = 0; lastT = now;
		if ( ! renderer.xr.isPresenting ) updateInfo();
	}

	if ( renderer.xr.isPresenting ) {
		vrLocomotion( dt );
		updateSound( dt );
		renderer.render( scene, camera ); // in VR direkt rendern (MSAA des XR-Framebuffers)
	} else {
		desktopMove( dt );
		updateSound( dt );
		pipeline.render();
	}
}
renderer.setAnimationLoop( animate );

window.__demo = { renderer: () => renderer, scene, settings, rig, camera, player, LOW, params, updateSun, lanterns, sound, actx, birds, setVRMenu, vrMenu, vrGui, xrBloom: () => xrBloom };
</script>
</body>
</html>
